
# ==================================================
# Industrial Gateway Configuration
# ==================================================

# 配置文件结构版本
# 注意：这是 YAML 结构版本，不是平台动态配置版本
schema_version: 1


# ==================================================
# 1. 网关基础配置
# ==================================================

gateway:
  # 网关唯一标识
  id: "industrial-gateway-001"


# ==================================================
# 2. 日志配置
# ==================================================

logging:

  # 日志等级
  # trace / debug / info / warn / error / critical
  level: info

  # 是否输出到控制台
  console_enabled: true

  # 是否输出到文件
  file_enabled: true

  # 日志文件路径
  file_path: "logs/gateway.log"

  # 日志滚动配置
  rotation:

    # 滚动策略：第一版仅支持按文件大小滚动
    strategy: size

    # 单个日志文件最大大小（字节）
    # 10 MB
    max_size_bytes: 10485760

    # 保留的历史轮转文件数量
    # 不包含当前正在写入的日志文件
    max_files: 5


# ==================================================
# 3. MQTT 配置
# ==================================================

mqtt:

  # 是否启用 MQTT
  enabled: true

  # MQTT Broker 地址
  host: "192.168.0.83"

  # MQTT Broker 端口
  port: 1883

  # MQTT 客户端 ID
  client_id: "industrial-gateway-001"

  # MQTT 心跳间隔（秒）
  keep_alive: 60


# ==================================================
# 4. SQLite 配置
# ==================================================

storage:

  # SQLite 数据库文件路径
  database_path: "data/gateway.db"

  # 数据库忙等待超时时间（毫秒）
  busy_timeout_ms: 5000


# ==================================================
# 5. 采集连接入口约束
# ==================================================

# 当前主程序采用动态配置模式，此项必须为 []，也可省略。
# 采集连接由 MQTT 完整快照下发，启动时优先恢复 SQLite 中的目标配置。
# 这里为空不代表没有采集：如果数据库已有有效快照，仍会恢复对应连接。
# 字段与消息说明见 docs/配置指南.md 和 docs/MQTT通信协议.md。
connections: []

# 底层协议工厂保留静态 YAML 文件接口，供独立调用方使用；
# 当前 GatewayRuntime 不提供静态模式，填写非空列表会导致启动失败。
